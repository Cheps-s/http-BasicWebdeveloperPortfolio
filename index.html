<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrei Nyl Manliclic | Full Stack Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/src/img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        primary: '#a855f7',
                        secondary: '#ec4899',
                        dark: '#0a0a0f',
                        darker: '#050508',
                        surface: '#13131f',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'gradient': 'gradient 8s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0f;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        canvas { display: block; }
        #c { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: -1; 
            background: #0a0a0f; 
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #f75570 0%, #9448ec 50%, #f75555 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 8s linear infinite;
        }
        
        .glass-card {
            background: rgba(19, 19, 31, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.1);
        }
        
        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.15);
        }
        
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: #f75555;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .orb-2 {
            width: 300px;
            height: 300px;
            background: #ec4848;
            bottom: -50px;
            left: -50px;
            animation-delay: 2s;
        }
        
        .orb-3 {
            width: 200px;
            height: 200px;
            background: #f16363;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }
        
        .nav-blur {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(12px);
        }
        
        .skill-tag {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.1));
            border: 1px solid rgba(168, 85, 247, 0.2);
            transition: all 0.3s ease;
        }
        
        .skill-tag:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2));
            transform: scale(1.05);
        }
        
        .project-card {
            position: relative;
            overflow: hidden;
        }
        
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .project-card:hover::before {
            left: 100%;
        }

        .reveal{
            opacity: 0;
            transform: translateY(39px);
            transition: all 0.7s ease-out;
        }

        .reveal.active{
            opacity: 1;
            transform: translateY(0);
        }
        
        :root {
            --nav-h: 5rem;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            --font-display: 'Space Grotesk', sans-serif;
            --success: #a855f7;
            --accent: #ec4899;
            --text-muted: #cbd5e1;
            --text-faint: rgba(255, 255, 255, 0.72);
            --border: rgba(255, 255, 255, 0.12);
            --glow: 0 0 40px rgba(168, 85, 247, 0.15);
        }

        .custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #a855f7;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s;
            mix-blend-mode: difference;
        }

        @media (max-width: 768px) {
            .custom-cursor {
                display: none;
            }
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 3rem;
            padding: calc(var(--nav-h) + 3rem) 2.5rem 4rem;
            max-width: 1180px;
            margin: 0 auto;
            z-index: 2;
        }

        @media (max-width: 1024px) {
            .hero {
                grid-template-columns: 1fr;
                padding: calc(var(--nav-h) + 2rem) 1.5rem 3rem;
                gap: 2.5rem;
            }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(168,85,247,0.08);
            border: 1px solid rgba(168,85,247,0.25);
            color: var(--success);
            border-radius: 100px;
            padding: 0.3rem 0.85rem;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: var(--font-mono);
            margin-bottom: 1.5rem;
            animation: hero-in 0.8s ease both;
        }

        .badge-dot {
            width: 7px; height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(168,85,247,0.4); }
            50%       { box-shadow: 0 0 0 6px rgba(168,85,247,0); }
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.6rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
        }

        .hero-title .line { display: block; }
        .hero-title em { font-style: normal; color: var(--accent); }

        .line-1 { animation: hero-in 0.7s 0.1s ease both; }
        .line-2 { animation: hero-in 0.7s 0.2s ease both; }
        .line-3 { animation: hero-in 0.7s 0.3s ease both; }

        @keyframes hero-in {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-sub {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 480px;
            margin-bottom: 2rem;
            animation: hero-in 0.7s 0.4s ease both;
        }

        .hero-cta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            animation: hero-in 0.7s 0.5s ease both;
        }

        .hero-stats {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-top: 3rem;
            animation: hero-in 0.7s 0.6s ease both;
        }

        .stat { text-align: center; }

        .stat-num {
            font-family: var(--font-mono);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            display: inline;
        }

        .stat-plus { font-family: var(--font-mono); font-size: 1.2rem; color: var(--accent); }

        .stat-label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.15rem;
        }

        .stat-divider {
            width: 1px;
            height: 36px;
            background: var(--border);
        }

        .hero-3d-wrapper {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            animation: hero-in 0.9s 0.3s ease both;
        }

        .hero-3d-card {
            position: relative;
            width: 340px; height: 280px;
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(-15deg);
            transition: transform 0.1s ease-out;
        }

        .card-face {
            position: absolute;
            inset: 0;
            background: rgba(13,17,23,0.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow:
                0 30px 80px rgba(0,0,0,0.5),
                0 0 0 1px rgba(0,229,255,0.08) inset,
                var(--glow);
        }

        .card-screen { flex: 1; }
        .code-lines { display: flex; flex-direction: column; gap: 0.3rem; }

        .code-line {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-muted);
        }
        .code-line.pl-2 { padding-left: 1.2rem; }
        .code-line.mt-2 { margin-top: 0.5rem; }

        .c-keyword  { color: #c792ea; }
        .c-var      { color: #82aaff; }
        .c-key      { color: #f07178; }
        .c-str      { color: #c3e88d; }
        .c-num      { color: #f78c6c; }

        .cursor-blink {
            animation: blink-cursor 1s step-end infinite;
            color: var(--accent);
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.2rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--success);
        }
        .status-dot {
            width: 7px; height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid;
            pointer-events: none;
        }
        .ring-1 {
            width: 280px; height: 280px;
            border-color: rgba(168,85,247,0.1);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(-20px);
            animation: spin-ring 20s linear infinite;
        }
        .ring-2 {
            width: 340px; height: 340px;
            border-color: rgba(124,58,237,0.08);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(-40px);
            animation: spin-ring 35s linear infinite reverse;
        }

        @keyframes spin-ring {
            from { transform: translate(-50%, -50%) translateZ(-20px) rotate(0deg); }
            to   { transform: translate(-50%, -50%) translateZ(-20px) rotate(360deg); }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.72rem;
            color: var(--text-faint);
            font-family: var(--font-mono);
            animation: hero-in 1s 0.8s ease both;
        }

        .scroll-mouse {
            width: 22px; height: 36px;
            border: 1.5px solid var(--text-faint);
            border-radius: 100px;
            display: flex;
            justify-content: center;
            padding-top: 6px;
        }
        .scroll-wheel {
            width: 3px; height: 8px;
            background: var(--text-faint);
            border-radius: 2px;
            animation: scroll-bounce 1.6s ease-in-out infinite;
        }
        @keyframes scroll-bounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            60%       { transform: translateY(8px); opacity: 0.2; }
        }
    </style>
</head>

</html>
