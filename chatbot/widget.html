<div id="chatbot-widget">
  <!-- Chat Button -->
  <button class="chat-button" id="chat-button" title="Open Chat">
    💬
  </button>

  <!-- Chat Window -->
  <div class="chat-window" id="chat-window">
    <!-- Header -->
    <div class="chat-header">
      <div>
        <h3 class="chat-header-title">NylTech Assistant</h3>
        <p class="chat-header-subtitle">Ask me anything!</p>
      </div>
      <div class="chat-header-actions">
        <button class="header-button theme-toggle" id="theme-toggle" title="Toggle theme">
          🌙
        </button>
        <button class="header-button" id="close-button" title="Close Chat">
          ✕
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty-state">
        <div class="chat-empty-state-icon">👋</div>
        <div class="chat-empty-state-title">Welcome!</div>
        <div class="chat-empty-state-text">
          Ask me about my skills, projects, or how to get in touch!
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <input
        type="text"
        class="chat-input"
        id="chat-input"
        placeholder="Type a message..."
        autocomplete="off"
      />
      <button class="send-button" id="send-button" title="Send">
        ➤
      </button>
    </div>
  </div>
</div>
