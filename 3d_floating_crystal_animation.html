
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
canvas { display: block; }
#c { background: #0a0a0f; width: 100%; height: 520px; }
</style>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.035);

const W = canvas.clientWidth, H = canvas.clientHeight;
const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
camera.position.set(0, 2, 10);
camera.lookAt(0, 0, 0);

const ambientLight = new THREE.AmbientLight(0x1a0a2e, 2);
scene.add(ambientLight);

const light1 = new THREE.PointLight(0xa855f7, 80, 30);
light1.position.set(-5, 5, 5);
light1.castShadow = true;
scene.add(light1);

const light2 = new THREE.PointLight(0xec4899, 60, 25);
light2.position.set(5, -3, 4);
light2.castShadow = true;
scene.add(light2);

const light3 = new THREE.PointLight(0x38bdf8, 40, 20);
light3.position.set(0, -5, 3);
scene.add(light3);

const light4 = new THREE.DirectionalLight(0xffffff, 0.5);
light4.position.set(0, 10, 5);
scene.add(light4);

function makeCrystal(color, emissive, scale, pos, rotSpeed) {
  const geo = new THREE.OctahedronGeometry(1, 0);
  const mat = new THREE.MeshPhysicalMaterial({
    color,
    emissive,
    emissiveIntensity: 0.3,
    metalness: 0.1,
    roughness: 0.05,
    transmission: 0.8,
    thickness: 1.5,
    reflectivity: 1,
    transparent: true,
    opacity: 0.88,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(scale.x, scale.y, scale.z);
  mesh.position.set(...pos);
  mesh.castShadow = true;
  mesh.userData = { rotSpeed, phase: Math.random() * Math.PI * 2, baseY: pos[1] };
  scene.add(mesh);

  const edgesGeo = new THREE.EdgesGeometry(geo);
  const edgesMat = new THREE.LineBasicMaterial({ color: emissive, transparent: true, opacity: 0.6 });
  const edges = new THREE.LineSegments(edgesGeo, edgesMat);
  mesh.add(edges);

  return mesh;
}

const crystals = [
  makeCrystal(0xc084fc, 0xa855f7, { x: 1.4, y: 2.2, z: 1.4 }, [0, 0, 0],    { x: 0.005, y: 0.008, z: 0.003 }),
  makeCrystal(0xf9a8d4, 0xec4899, { x: 0.8, y: 1.4, z: 0.8 }, [-3.5, 1, -2], { x: 0.007, y: 0.005, z: 0.006 }),
  makeCrystal(0x67e8f9, 0x38bdf8, { x: 0.6, y: 1.1, z: 0.6 }, [3.2, -0.5, -1],{ x: 0.004, y: 0.009, z: 0.005 }),
  makeCrystal(0xc4b5fd, 0x7c3aed, { x: 0.5, y: 0.9, z: 0.5 }, [-1.8, -1.8, 1],{ x: 0.009, y: 0.004, z: 0.007 }),
  makeCrystal(0xfda4af, 0xf43f5e, { x: 0.4, y: 0.75, z: 0.4 }, [2, 2, 0.5],  { x: 0.006, y: 0.007, z: 0.004 }),
  makeCrystal(0xa5f3fc, 0x0ea5e9, { x: 0.35, y: 0.65, z: 0.35 }, [0.5, -2.5, 1.5],{ x: 0.008, y: 0.006, z: 0.009 }),
  makeCrystal(0xd8b4fe, 0x9333ea, { x: 0.3, y: 0.55, z: 0.3 }, [-2.5, 2.2, 0.5],{ x: 0.01, y: 0.005, z: 0.006 }),
];

const particleCount = 200;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);
const palette = [
  new THREE.Color(0xa855f7),
  new THREE.Color(0xec4899),
  new THREE.Color(0x38bdf8),
  new THREE.Color(0x7c3aed),
];
for (let i = 0; i < particleCount; i++) {
  pPos[i * 3]     = (Math.random() - 0.5) * 18;
  pPos[i * 3 + 1] = (Math.random() - 0.5) * 14;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 10 - 2;
  const c = palette[Math.floor(Math.random() * palette.length)];
  pColors[i * 3]     = c.r;
  pColors[i * 3 + 1] = c.g;
  pColors[i * 3 + 2] = c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
const pMat = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, transparent: true, opacity: 0.7 });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

const ringGeo = new THREE.TorusGeometry(4.5, 0.015, 8, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.25 });
const ring1 = new THREE.Mesh(ringGeo, ringMat);
ring1.rotation.x = Math.PI / 2.5;
scene.add(ring1);

const ring2Geo = new THREE.TorusGeometry(3.2, 0.01, 8, 80);
const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.18 });
const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
ring2.rotation.x = Math.PI / 3;
ring2.rotation.z = Math.PI / 6;
scene.add(ring2);

let mouse = { x: 0, y: 0 };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
  mouse.y = -((e.clientY - rect.top) / rect.height - 0.5) * 2;
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  crystals.forEach((c, i) => {
    c.rotation.x += c.userData.rotSpeed.x;
    c.rotation.y += c.userData.rotSpeed.y;
    c.rotation.z += c.userData.rotSpeed.z;
    c.position.y = c.userData.baseY + Math.sin(t + c.userData.phase) * 0.35;
    c.material.emissiveIntensity = 0.2 + Math.sin(t * 1.5 + c.userData.phase) * 0.15;
  });

  particles.rotation.y += 0.0008;
  particles.rotation.x += 0.0003;

  ring1.rotation.z += 0.003;
  ring2.rotation.y += 0.004;

  light1.position.x = Math.sin(t * 0.7) * 6;
  light1.position.z = Math.cos(t * 0.5) * 5;
  light2.position.x = Math.cos(t * 0.6) * 5;
  light2.position.z = Math.sin(t * 0.8) * 4;

  camera.position.x += (mouse.x * 1.5 - camera.position.x) * 0.03;
  camera.position.y += (mouse.y * 1.0 + 2 - camera.position.y) * 0.03;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
